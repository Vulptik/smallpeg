[package]
name = "smallpeg-wasm"
version = "0.13.1"
edition = "2024"
rust-version = "1.88"
description = "JavaScript bindings for smallpeg (the npm package)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
smallpeg = { path = ".." }
# Pinned: must match the wasm-bindgen CLI that generates the JS glue.
wasm-bindgen = "=0.2.95"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[lints.rust]
# The pinned wasm-bindgen's macros emit this cfg; newer compilers flag it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(wasm_bindgen_unstable_test_coverage)"] }
