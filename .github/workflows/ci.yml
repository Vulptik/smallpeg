name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release
      - name: wasm build
        run: cargo build --release --target wasm32-unknown-unknown
      - name: wasm build (parallel feature must fail)
        run: |
          if cargo build --release --target wasm32-unknown-unknown --features parallel 2>/dev/null; then
            echo "expected compile_error for parallel on wasm32" && exit 1
          fi
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Package check
        run: cargo publish --dry-run --allow-dirty

  msrv:
    # rust-version in Cargo.toml is a promise; this keeps it honest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build at the declared MSRV
        run: cargo build --release
